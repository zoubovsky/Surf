#cloud-config
# =============================================================================
# Surf production host — Ubuntu 24.04 user-data for Hetzner Cloud.
#
# Rendered by .github/workflows/provision.yml, which substitutes:
#   __GITHUB_REPOSITORY__   owner/repo (zoubovsky/Surf)
#   __RUNNER_REG_TOKEN__    a 1-hour GitHub runner registration token minted by the
#                           workflow with RUNNER_PAT (preferred: the PAT never leaves
#                           GitHub Actions and never lands in Hetzner user-data)
#   __RUNNER_PAT__          left empty by the workflow; fallback path that lets the
#                           box mint its own registration token if you render by hand
# Hetzner caps user-data at 32 KiB; this file is well under that.
#
# What it does: apt update/upgrade; Docker CE + compose plugin from Docker's repo;
# user `surf` (docker group); /etc/surf (0700, surf) and /var/lib/surf/data
# (1000:1000 = `node` inside the daemon image); unattended-upgrades; ufw deny-all
# inbound (sshd is left running but unreachable — enable a rule from the Hetzner
# console if you ever need SSH); GitHub Actions self-hosted runner `surf-prod`
# (label surf-prod) under /opt/actions-runner as a systemd service running as surf.
# Everything is logged to /var/log/surf-cloud-init.log.
# =============================================================================

output:
  all: "| tee -a /var/log/surf-cloud-init.log"

package_update: true
package_upgrade: true
package_reboot_if_required: false

packages:
  - ca-certificates
  - curl
  - jq
  - gnupg
  - tar
  - ufw
  - unattended-upgrades
  - apt-listchanges

groups:
  - docker

users:
  - name: surf
    gecos: Surf daemon operator
    shell: /bin/bash
    lock_passwd: true
    groups: [docker]

write_files:
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "10" },
        "live-restore": true
      }

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52surf-unattended
    permissions: "0644"
    content: |
      // Security updates only (default origins). Never reboot on its own: the
      // daemon holds a live WebSocket and open positions have exchange-side stops,
      // but a surprise reboot mid-cycle is still undesirable. Reboot via ops/console.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

  - path: /usr/local/sbin/surf-bootstrap.sh
    permissions: "0700"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # Runs once from runcmd. No `set -x`: this script handles a registration token.
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive

      GITHUB_REPOSITORY="__GITHUB_REPOSITORY__"
      RUNNER_REG_TOKEN="__RUNNER_REG_TOKEN__"
      RUNNER_PAT="__RUNNER_PAT__"
      RUNNER_NAME="surf-prod"
      RUNNER_LABELS="surf-prod"
      RUNNER_DIR="/opt/actions-runner"
      RUNNER_USER="surf"

      log() { echo "[surf-bootstrap] $(date -u +%FT%TZ) $*"; }

      # ---- 1. Docker CE from Docker's apt repository (docs.docker.com/engine/install/ubuntu)
      log "installing Docker CE"
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      cat > /etc/apt/sources.list.d/docker.sources <<EOF
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}
      Components: stable
      Architectures: $(dpkg --print-architecture)
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF
      apt-get update -y
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      usermod -aG docker "$RUNNER_USER"
      docker --version && docker compose version

      # ---- 2. Directories
      log "creating /etc/surf and /var/lib/surf/data"
      install -d -m 0700 -o "$RUNNER_USER" -g "$RUNNER_USER" /etc/surf
      install -d -m 0750 -o 1000 -g 1000 /var/lib/surf/data
      install -d -m 0750 -o 1000 -g 1000 /var/lib/surf/data/backups

      # ---- 3. Swap (2 GiB safety net; the daemon is capped at 3 GiB by compose)
      if ! swapon --show | grep -q swapfile; then
        fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi

      # ---- 4. Firewall: deny everything inbound, allow outbound. sshd keeps running but
      # is unreachable (also blocked by the Hetzner cloud firewall). To get SSH later:
      # Hetzner console -> add an inbound rule to surf-fw, then `ufw allow from <ip> to any port 22`.
      log "configuring ufw"
      ufw --force reset >/dev/null
      ufw default deny incoming
      ufw default allow outgoing
      ufw --force enable
      ufw status verbose

      # ---- 5. unattended-upgrades
      systemctl enable --now unattended-upgrades || true

      # ---- 6. GitHub Actions runner
      log "installing GitHub Actions runner"
      install -d -m 0755 -o "$RUNNER_USER" -g "$RUNNER_USER" "$RUNNER_DIR"
      RELEASE_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/actions/runner/releases/latest)"
      RUNNER_VERSION="$(jq -r .tag_name <<<"$RELEASE_JSON" | sed 's/^v//')"
      TARBALL="actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
      URL="https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/${TARBALL}"
      log "runner version ${RUNNER_VERSION}"
      curl -fsSL -o "/tmp/${TARBALL}" "$URL"
      # The release notes embed the sha256 as <!-- BEGIN SHA linux-x64 -->hash<!-- END SHA linux-x64 -->
      EXPECTED_SHA="$(jq -r .body <<<"$RELEASE_JSON" | grep -oP '(?<=BEGIN SHA linux-x64 -->)[0-9a-f]{64}' || true)"
      if [ -n "$EXPECTED_SHA" ]; then
        echo "${EXPECTED_SHA}  /tmp/${TARBALL}" | sha256sum -c -
      else
        log "WARNING: could not find sha256 in release notes; skipping checksum"
      fi
      tar -xzf "/tmp/${TARBALL}" -C "$RUNNER_DIR"
      rm -f "/tmp/${TARBALL}"
      chown -R "$RUNNER_USER:$RUNNER_USER" "$RUNNER_DIR"
      "$RUNNER_DIR/bin/installdependencies.sh"

      if [ -z "$RUNNER_REG_TOKEN" ] && [ -n "$RUNNER_PAT" ]; then
        log "minting registration token with PAT"
        RUNNER_REG_TOKEN="$(curl -fsSL -X POST \
          -H "Authorization: Bearer ${RUNNER_PAT}" \
          -H 'Accept: application/vnd.github+json' \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" | jq -r .token)"
      fi
      if [ -z "$RUNNER_REG_TOKEN" ] || [ "$RUNNER_REG_TOKEN" = "null" ]; then
        log "ERROR: no runner registration token available; runner NOT registered"
        exit 1
      fi

      cd "$RUNNER_DIR"
      runuser -u "$RUNNER_USER" -- ./config.sh --unattended \
        --url "https://github.com/${GITHUB_REPOSITORY}" \
        --token "$RUNNER_REG_TOKEN" \
        --name "$RUNNER_NAME" \
        --labels "$RUNNER_LABELS" \
        --work _work \
        --replace
      ./svc.sh install "$RUNNER_USER"
      ./svc.sh start
      ./svc.sh status || true

      unset RUNNER_REG_TOKEN RUNNER_PAT
      log "bootstrap complete"

runcmd:
  - [
      bash,
      -c,
      "/usr/local/sbin/surf-bootstrap.sh; rc=$?; shred -u /usr/local/sbin/surf-bootstrap.sh || rm -f /usr/local/sbin/surf-bootstrap.sh; exit $rc",
    ]

final_message: "surf host ready after $UPTIME seconds; see /var/log/surf-cloud-init.log"
